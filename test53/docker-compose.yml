# test53 — runtime image only. ./run-docker.sh --build compiles the Go binary
# first, then this compose copies just that binary (tiny context, no source tree).

services:
  test53:
    build:
      context: .bin
      dockerfile: Dockerfile
    image: test53:local
    container_name: test53
    env_file:
      - .env
    environment:
      TEST53_LAYERS: "${TEST53_LAYERS:-dense}"
      TEST53_MODES: "${TEST53_MODES:-all}"
      TEST53_DTYPES: "${TEST53_DTYPES:-all}"
      TEST53_LRS: "${TEST53_LRS:-funny-lo}"
      TEST53_CAMS: "${TEST53_CAMS:-1}"
      TEST53_WORKERS: "${TEST53_WORKERS:-4}"
      TEST53_DURATION: "${TEST53_DURATION:-2s}"
      TEST53_LR: "${TEST53_LR:-0.05}"
      TEST53_HIDDEN: "${TEST53_HIDDEN:-32}"
      TEST53_CKPT: "/app/test53_ckpt"
      TEST53_CKPT_FLAT: "true"
      TEST53_RESUME: "true"
      TEST53_TIDE_ADDR: "0.0.0.0:8080"
      GOMEMLIMIT: "${GOMEMLIMIT:-6GiB}"
      GOGC: "${GOGC:-50}"
    ports:
      - "${TIDE_PORT:-8080}:8080"
    volumes:
      - ${TEST53_CKPT_HOST:-./test53_ckpt}:/app/test53_ckpt:z
    restart: always
    working_dir: /app
    mem_limit: ${TEST53_MEM_LIMIT:-7g}
