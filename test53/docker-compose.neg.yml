# Override for negative-LR farm (./run-docker-neg.sh).
# Port comes from TIDE_PORT (default 8081 via the wrapper).
services:
  test53:
    container_name: "${TEST53_CONTAINER_NAME:-test53-neg}"
    image: test53:local
    environment:
      TEST53_LRS: "${TEST53_LRS:-funny-neg}"
      TEST53_CAMS: "${TEST53_CAMS:-1}"
