<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test51 · tree report</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #171d25; --ink: #e8eef5; --muted: #8b9aab;
      --line: #2a3441; --accent: #3dd6c6; --good: #6bcf7f; --bad: #e86a6a;
      --warn: #e0b44e; --chip: #243041;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.45 var(--font);
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a3a3a55, transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, #2a243855, transparent);
      min-height: 100vh;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 1rem 1.25rem 2.5rem; }
    header {
      display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end;
      justify-content: space-between; margin-bottom: 1rem;
    }
    h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.02em; }
    h1 em { color: var(--accent); font-style: normal; }
    .sub { color: var(--muted); margin: 0.25rem 0 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .btn {
      display: inline-block; text-decoration: none; border: 0; border-radius: 6px;
      padding: 0.5rem 0.95rem; font-weight: 700; cursor: pointer; font: inherit;
    }
    .btn.primary { background: var(--accent); color: #062a28; }
    .btn.ghost { background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.75rem 0 1rem; }
    .chip {
      background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
      padding: 0.2rem 0.65rem; font-family: var(--mono); font-size: 12px;
    }
    .chip.hot { border-color: #3dd6c688; color: var(--accent); }
    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;
    }
    @media (max-width: 800px) { .stats { grid-template-columns: 1fr 1fr; } }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 0.85rem 1rem;
    }
    .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat .v { font-family: var(--mono); font-size: 1.25rem; margin-top: 0.25rem; color: var(--accent); }
    .charts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;
    }
    @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    }
    .panel h3 {
      margin: 0; padding: 0.65rem 0.9rem; font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line);
    }
    .panel .body { padding: 0.75rem; }
    canvas.chart { width: 100%; height: 240px; display: block; background: #0b1016; border-radius: 6px; }
    .table-scroll { max-height: 520px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 0.4rem 0.55rem; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
    tr.best { background: #1e3a3a66; }
    .delta.pos { color: var(--good); }
    .delta.neg { color: var(--bad); }
    .err { color: var(--muted); padding: 2rem; text-align: center; }
    @media print {
      body { background: #fff; color: #111; background-image: none; }
      .btn, .no-print { display: none !important; }
      .panel, .stat { break-inside: avoid; border-color: #ccc; background: #fff; }
      .stat .v, h1 em { color: #0a7; }
      canvas.chart { background: #f7f7f7; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Tree report <em id="title">#—</em></h1>
        <p class="sub" id="subtitle">Loading…</p>
      </div>
      <div class="actions no-print">
        <a class="btn ghost" href="/">← dash</a>
        <a class="btn primary" id="pdfBtn" href="#">Download PDF</a>
        <button class="btn ghost" type="button" id="printBtn">Print</button>
      </div>
    </header>

    <div class="chips" id="chips"></div>
    <div class="stats" id="stats"></div>

    <div class="charts">
      <section class="panel">
        <h3>Accuracy by learning rate</h3>
        <div class="body"><canvas class="chart" id="accLR" width="560" height="240"></canvas></div>
      </section>
      <section class="panel">
        <h3>Score by learning rate</h3>
        <div class="body"><canvas class="chart" id="scoreLR" width="560" height="240"></canvas></div>
      </section>
      <section class="panel">
        <h3>Δacc (self-improve) by leaf</h3>
        <div class="body"><canvas class="chart" id="deltaBars" width="560" height="240"></canvas></div>
      </section>
      <section class="panel">
        <h3>Score heatmap · cams × grid</h3>
        <div class="body"><canvas class="chart" id="heat" width="560" height="240"></canvas></div>
      </section>
    </div>

    <section class="panel">
      <h3>All leaves · sorted by score</h3>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th><th>LR</th><th>Cam</th><th>Grid</th>
              <th>Acc</th><th>Soft</th><th>Score</th><th>Avail</th>
              <th>Δacc</th><th>Δ%</th><th>RAM</th><th>Levels</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const n = Number((location.pathname.match(/\/report\/(\d+)/) || [])[1] || params.get("n") || 0);

    const $ = (id) => document.getElementById(id);
    const fmt = (v, d = 1) => (v == null || Number.isNaN(+v) ? "—" : (+v).toFixed(d));
    const delta = (v) => {
      if (v == null || Number.isNaN(+v)) return "—";
      const n = +v;
      const cls = n > 0 ? "pos" : n < 0 ? "neg" : "";
      return `<span class="delta ${cls}">${n > 0 ? "+" : ""}${n.toFixed(1)}</span>`;
    };

    function avgBy(rows, keyFn, valFn) {
      const m = new Map();
      for (const r of rows) {
        if (r.error) continue;
        const k = keyFn(r);
        const cur = m.get(k) || { sum: 0, n: 0 };
        cur.sum += valFn(r); cur.n++;
        m.set(k, cur);
      }
      return [...m.entries()].map(([k, v]) => ({ k, v: v.sum / v.n })).sort((a, b) => a.k - b.k);
    }

    function drawAxes(ctx, W, H, pad) {
      ctx.strokeStyle = "#2a3441";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, H - pad.b);
      ctx.lineTo(W - pad.r, H - pad.b);
      ctx.stroke();
    }

    function drawBars(canvas, points, color, yLabel) {
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const pad = { l: 44, r: 12, t: 16, b: 36 };
      ctx.fillStyle = "#0b1016";
      ctx.fillRect(0, 0, W, H);
      if (!points.length) {
        ctx.fillStyle = "#8b9aab";
        ctx.fillText("no data", W / 2 - 20, H / 2);
        return;
      }
      const vals = points.map((p) => p.v);
      const max = Math.max(...vals, 1);
      const min = Math.min(0, ...vals);
      const span = Math.max(max - min, 1e-6);
      drawAxes(ctx, W, H, pad);
      const iw = W - pad.l - pad.r;
      const ih = H - pad.t - pad.b;
      const bw = Math.max(4, iw / points.length - 4);
      const zeroY = pad.t + ih * (max / span);
      ctx.fillStyle = color;
      points.forEach((p, i) => {
        const x = pad.l + (i + 0.5) * (iw / points.length) - bw / 2;
        const y = pad.t + ih * ((max - p.v) / span);
        const h = Math.abs(zeroY - y);
        ctx.fillRect(x, Math.min(y, zeroY), bw, Math.max(h, 1));
      });
      ctx.fillStyle = "#8b9aab";
      ctx.font = "11px monospace";
      ctx.fillText(yLabel || "", 8, 14);
      const step = Math.max(1, Math.ceil(points.length / 8));
      points.forEach((p, i) => {
        if (i % step) return;
        const x = pad.l + (i + 0.5) * (iw / points.length);
        ctx.fillText(String(p.k), x - 10, H - 12);
      });
    }

    function drawHeat(canvas, rows) {
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = "#0b1016";
      ctx.fillRect(0, 0, W, H);
      const cams = [...new Set(rows.map((r) => r.cams || 1))].sort((a, b) => a - b);
      const grids = [...new Set(rows.map((r) => r.grid_n || 1))].sort((a, b) => a - b);
      if (!cams.length || !grids.length) return;
      const cell = {};
      let max = 1;
      for (const r of rows) {
        if (r.error) continue;
        const k = `${r.cams || 1}|${r.grid_n || 1}`;
        const cur = cell[k] || { sum: 0, n: 0 };
        cur.sum += r.score || 0; cur.n++;
        cell[k] = cur;
        max = Math.max(max, cur.sum / cur.n);
      }
      const pad = { l: 48, r: 16, t: 20, b: 36 };
      const cw = (W - pad.l - pad.r) / grids.length;
      const ch = (H - pad.t - pad.b) / cams.length;
      ctx.font = "11px monospace";
      ctx.fillStyle = "#8b9aab";
      cams.forEach((c, yi) => ctx.fillText(`cam ${c}`, 6, pad.t + (yi + 0.55) * ch));
      grids.forEach((g, xi) => ctx.fillText(`${g}³`, pad.l + (xi + 0.35) * cw, H - 12));
      cams.forEach((c, yi) => {
        grids.forEach((g, xi) => {
          const cur = cell[`${c}|${g}`];
          const v = cur ? cur.sum / cur.n : 0;
          const t = v / max;
          ctx.fillStyle = `rgba(61,214,198,${0.12 + 0.85 * t})`;
          ctx.fillRect(pad.l + xi * cw + 2, pad.t + yi * ch + 2, cw - 4, ch - 4);
          ctx.fillStyle = "#e8eef5";
          ctx.fillText(v ? v.toFixed(0) : "—", pad.l + xi * cw + cw / 2 - 12, pad.t + yi * ch + ch / 2 + 4);
        });
      });
    }

    function render(rep) {
      $("title").textContent = `#${rep.index}`;
      $("subtitle").textContent =
        `${rep.mode} · ${rep.layer}/${rep.dtype} · ${rep.challenge} · ${rep.leaves} leaves · finished ${rep.finished || "—"}`;
      $("pdfBtn").href = `/report/${rep.index}.pdf`;
      $("chips").innerHTML = `
        <span class="chip hot">${rep.mode}</span>
        <span class="chip">${rep.layer}</span>
        <span class="chip">${rep.dtype}</span>
        <span class="chip">${rep.challenge}</span>
        <span class="chip">best ${rep.best_id || "—"}</span>`;
      $("stats").innerHTML = `
        <div class="stat"><div class="k">Best Acc</div><div class="v">${fmt(rep.best_acc)}</div></div>
        <div class="stat"><div class="k">Best Score</div><div class="v">${fmt(rep.best_score, 0)}</div></div>
        <div class="stat"><div class="k">Best Δacc</div><div class="v">${fmt(rep.best_acc_delta)}</div></div>
        <div class="stat"><div class="k">Best leaf</div><div class="v" style="font-size:0.95rem">
          lr ${fmt(rep.best_lr, rep.best_lr >= 100 ? 0 : 2)} · cam ${rep.best_cams} · ${rep.best_grid}³
        </div></div>`;

      const rows = (rep.rows || []).slice().sort((a, b) => (b.score || 0) - (a.score || 0));
      $("rows").innerHTML = rows.map((r, i) => {
        const best = r.id === rep.best_id ||
          (r.lr === rep.best_lr && r.cams === rep.best_cams && r.grid_n === rep.best_grid);
        return `<tr class="${best ? "best" : ""}">
          <td>${i + 1}</td>
          <td>${fmt(r.lr, r.lr >= 100 ? 0 : 2)}</td>
          <td>${r.cams ?? "—"}</td>
          <td>${r.grid_n || 1}³</td>
          <td>${fmt(r.acc)}</td>
          <td>${fmt(r.soft_acc)}</td>
          <td>${fmt(r.score, 0)}</td>
          <td>${fmt(r.availability)}</td>
          <td>${delta(r.acc_delta)}</td>
          <td>${delta(r.improve_pct)}</td>
          <td>${fmt(r.ram_kib, 0)}</td>
          <td>${r.levels ?? 0}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="12" class="err">No leaf rows stored for this report.</td></tr>`;

      const ok = rows.filter((r) => !r.error);
      drawBars($("accLR"), avgBy(ok, (r) => r.lr, (r) => r.acc || 0), "#3dd6c6", "acc");
      drawBars($("scoreLR"), avgBy(ok, (r) => r.lr, (r) => r.score || 0), "#6bcf7f", "score");
      const deltas = ok.map((r, i) => ({
        k: `${r.cams}c/${r.grid_n}³`,
        v: r.acc_delta || 0,
        i,
      }));
      // keep chart readable: top 24 by |Δ|
      const shown = deltas.slice().sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 24)
        .sort((a, b) => a.i - b.i);
      drawBars($("deltaBars"), shown.map((d) => ({ k: d.k, v: d.v })), "#e0b44e", "Δacc");
      drawHeat($("heat"), ok);
    }

    async function main() {
      if (!n) {
        document.body.innerHTML = `<p class="err">Missing report number. Use /report/1</p>`;
        return;
      }
      try {
        const res = await fetch(`/api/report/${n}`, { cache: "no-store" });
        if (!res.ok) throw new Error(await res.text());
        render(await res.json());
      } catch (e) {
        document.body.innerHTML = `<p class="err">Report #${n} not found yet. Finish a tree first.<br>${e}</p>`;
      }
    }
    $("printBtn").onclick = () => window.print();
    main();
  </script>
</body>
</html>
